[application]
name = "AI Agent Platform"
version = "0.1.3"
workspace_root = "./workspace"
auto_install_deps = true

[logging]
level = "INFO"
log_file = "./logs/platform.jsonl"
enable_tracing = true

[runtime]
max_iterations = 15
max_tool_calls = 20
timeout_seconds = 600
retry_limit = 3

[models]
default_provider = "lm_studio"
default_model = ""
temperature = 0.7
max_tokens = 4096

[models.providers.lm_studio]
base_url = "http://localhost:1234"

[models.providers.mock]
enabled = true

[security]
require_approval_for_high_risk = true
allowed_terminal_commands = []
disallowed_terminal_commands = ["rm -rf /", "format C:", "mkfs", ":(){:|:&};:"]
# Shell may not open sockets. Filesystem tools are unaffected.
allow_terminal_network = false
# When true, file tools may only touch allowed_files for the task.
strict_attachments = false
# Auto-approve tools at or below this risk. Critical always asks a human.
# read_only | low | medium | high
auto_approve_up_to = "low"

[tools]
web_search_enabled = true
fetch_url_enabled = true
terminal_enabled = true
fs_enabled = true

[mcp]
enabled = true
servers = []
# Empty = publish every discovered tool the policy would run without a human.
# New packs are included automatically. ["*"] publishes every non-critical tool.
# An explicit list is a manual allowlist (still checked by the security policy).
published_tools = []

[storage]
type = "json"
sessions_dir = "./sessions"
state_dir = "./state"

[ui]
enabled = true
host = "127.0.0.1"
port = 8765
