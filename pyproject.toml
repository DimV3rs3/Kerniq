[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "Kerniq"
version = "0.1.8"
description = "A modular Open Source AI Agent Platform"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.24.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]
mcp = [
    "mcp>=1.0.0",
]
mysql = [
    "pymysql>=1.1.0",
]

[project.scripts]
kerniq = "Kerniq.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["Kerniq*"]
exclude = []

[tool.pytest.ini_options]
testpaths = ["tests", "plugins"]
pythonpath = ["src"]
python_files = ["test_*.py"]
norecursedirs = [".git", "node_modules", "__pycache__", "*.egg-info", "static", "vendor"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
